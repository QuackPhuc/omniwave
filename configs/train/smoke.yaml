seed: 17
model_config: configs/model/omniweave_t.yaml
backend: reference
data:
  root: /datasets/imagenet
  image_size: 224
  expected_classes: 100
  subset_samples: 64
  num_workers: 2
train:
  epochs: 3
  global_batch_size: 32
  accumulation_steps: 1
  learning_rate: 0.001
  weight_decay: 0.05
  gradient_clip_norm: 1.0
  amp: false
  label_smoothing: 0.0
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
  ema: true
  checkpoint_minutes: 1
output_dir: runs/smoke
